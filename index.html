<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>점심 메뉴 & 로또</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0f1114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="오늘의 점심">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>오늘의 점심</h1>
      <p class="today-date" id="todayDate"></p>
    </header>
    <p class="weekend-notice" id="weekendNotice" hidden>주말에는 이전 메뉴가 표시될 수 있습니다.</p>

    <div id="app">
      <div class="actions" id="lunchBoard"></div>

      <div class="quick-actions">
        <button class="btn" onclick="generateLotto()">로또<span class="btn-long"> 번호 뽑기</span></button>
        <button class="btn" onclick="startCoffee()">커피 내기</button>
      </div>
      <div class="side-panels">
        <div id="lottoResult" class="lotto-result" style="display:none">
          <div class="lotto-label">이번 주 행운의 번호</div>
          <div class="lotto-numbers" id="lottoNumbers"></div>
          <div class="lotto-bonus">
            <span class="lotto-plus">+</span>
            <span class="lotto-bonus-ball" id="lottoBonus"></span>
          </div>
        </div>
        <div id="coffeeGame" class="coffee-game" style="display:none">
          <div class="coffee-stepper">
            <button type="button" class="coffee-step" aria-label="인원 줄이기" onclick="changeCoffeeCount(-1)">−</button>
            <span class="coffee-count" id="coffeeCount"></span>
            <button type="button" class="coffee-step" aria-label="인원 늘리기" onclick="changeCoffeeCount(1)">+</button>
          </div>
          <div class="coffee-cards" id="coffeeCards"></div>
          <div class="coffee-status" id="coffeeStatus" aria-live="polite"></div>
        </div>
      </div>

      <div class="modal-overlay" id="lunchModal" role="dialog" aria-modal="true" aria-label="식단표 크게 보기" onclick="handleLunchModalClick(event)">
        <button type="button" class="modal-close" aria-label="닫기">✕</button>
        <div class="lunch-modal-content" id="lunchModalContent"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. 날짜 변경 감지 (화면 복귀, 포커스, 뒤로가기 복원, 켜 둔 화면은 1분 주기)
    document.addEventListener('visibilitychange', checkAndReloadIfStale);
    window.addEventListener('focus', checkAndReloadIfStale);
    window.addEventListener('pageshow', checkAndReloadIfStale);
    setInterval(checkAndReloadIfStale, 60000);

    // 2. 날짜 관련 유틸리티
    function getSeoulDateKey(date) {
      var offset = 9 * 60;
      var kstTime = new Date(date.getTime() + offset * 60000);
      return kstTime.toISOString().slice(0, 10);
    }

    // 탭끼리 공유되는 저장소가 아니라 이 페이지를 불러온 날짜와 비교해야
    // 다른 탭이 먼저 열려도 오래된 탭이 새로고침된다.
    var pageLoadDateKey = getSeoulDateKey(new Date());

    function checkAndReloadIfStale() {
      if (document.visibilityState !== 'visible') return;
      if (getSeoulDateKey(new Date()) === pageLoadDateKey) return;
      window.location.replace(window.location.pathname + '?refresh=' + Date.now());
    }

    document.getElementById('todayDate').textContent = new Intl.DateTimeFormat('ko-KR', {
      timeZone: 'Asia/Seoul',
      month: 'long',
      day: 'numeric',
      weekday: 'long'
    }).format(new Date());

    var seoulWeekday = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', weekday: 'short' }).format(new Date());
    document.getElementById('weekendNotice').hidden = seoulWeekday !== 'Sat' && seoulWeekday !== 'Sun';

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // 3. 점심 메뉴 로직
    var lunchItems = [];

    async function loadLunchMenus() {
      document.getElementById('lunchBoard').innerHTML =
        '<div class="loading"><div class="spinner"></div>메뉴를 불러오는 중</div>';
      try {
        var response = await fetch('/api/lunch', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var payload = await response.json();
        renderLunchBoard(payload.items || []);
      } catch (error) {
        renderLunchBoard([{
          name: '점심 메뉴',
          error: true,
          message: '메뉴를 불러오지 못했습니다.'
        }]);
      }
    }

    function renderLunchImage(item) {
      return '<img class="lunch-modal-image" src="' + escapeHtml(item.imageUrl) + '" alt="' + escapeHtml(item.name) + ' 식단표">';
    }

    function renderLunchError(item) {
      var channelLink = item.channelUrl
        ? '<a class="lunch-channel-link" href="' + escapeHtml(item.channelUrl) + '" target="_blank" rel="noopener">카카오 채널에서 보기</a>'
        : '';
      return '<div class="lunch-sub">' + escapeHtml(item.message) + '</div>' + channelLink +
             '<button type="button" class="btn btn-retry" onclick="loadLunchMenus()">다시 시도</button>';
    }

    function renderLunchBoard(items) {
      lunchItems = items;
      var lunchBoard = document.getElementById('lunchBoard');
      if (!lunchItems.length) {
        lunchBoard.innerHTML = '<div class="lunch-modal-item" style="text-align:center;padding:20px;"><div class="lunch-sub">표시할 메뉴가 없습니다.</div></div>';
        return;
      }
      var viewableIndex = 0;
      lunchBoard.innerHTML = lunchItems.map(function (item) {
        var clickAttrs = item.error ? '' : ' role="button" tabindex="0" onclick="showLunchModal(' + (viewableIndex++) + ')" style="cursor:pointer;"';
        var errorContent = item.error ? renderLunchError(item) : '';
        var imgContent = item.imageUrl ? renderLunchImage(item) : '';
        
        return '<div class="lunch-modal-item' + (item.error ? ' is-error' : '') + '"' + clickAttrs + '>' +
               '<div class="lunch-name">' + escapeHtml(item.name) + '</div>' +
               errorContent + imgContent + '</div>';
      }).join('');
    }

    var lunchModalHistoryPushed = false;

    var lunchModalOpener = null;

    function showLunchModal(index) {
      lunchModalOpener = document.activeElement;
      var content = document.getElementById('lunchModalContent');
      var modal = document.getElementById('lunchModal');
      content.innerHTML = lunchItems.filter(function (item) {
        return !item.error;
      }).map(function (item, itemIndex) {
        return '<div class="lunch-modal-item' + (itemIndex === index ? ' is-selected' : '') + '">' +
               '<div class="lunch-name">' + escapeHtml(item.name) + '</div>' +
               renderLunchImage(item) +
               '</div>';
      }).join('');
      modal.classList.add('active');
      document.body.classList.add('modal-open');
      modal.scrollTop = 0;

      // 뒤로가기가 페이지 이탈 대신 모달 닫기로 동작하도록 기록을 하나 쌓는다.
      history.pushState({ lunchModal: true }, '');
      lunchModalHistoryPushed = true;
      modal.querySelector('.modal-close').focus();
    }

    function hideLunchModal() {
      var modal = document.getElementById('lunchModal');
      var wasOpen = modal.classList.contains('active');
      lunchModalHistoryPushed = false;
      modal.classList.remove('active');
      document.body.classList.remove('modal-open');
      // 키보드 사용자가 모달을 연 카드로 돌아오게 한다.
      if (wasOpen && lunchModalOpener && lunchModalOpener.focus) lunchModalOpener.focus();
    }

    function closeLunchModal() {
      if (lunchModalHistoryPushed) {
        // popstate에서 실제로 닫는다. 연속 탭으로 페이지를 벗어나지 않도록 먼저 해제한다.
        lunchModalHistoryPushed = false;
        history.back();
        return;
      }
      hideLunchModal();
    }

    // 이미지와 식당 이름을 제외한 영역(닫기 버튼 포함)을 누르면 닫는다.
    function handleLunchModalClick(event) {
      if (!event.target.closest('img, .lunch-name')) closeLunchModal();
    }

    window.addEventListener('popstate', hideLunchModal);

    document.addEventListener('keydown', function (event) {
      var modalOpen = document.getElementById('lunchModal').classList.contains('active');
      if (event.key === 'Escape' && modalOpen) {
        closeLunchModal();
      } else if (event.key === 'Tab' && modalOpen) {
        // 모달 안에서 이동할 수 있는 요소는 닫기 버튼뿐이므로 포커스를 그 안에 묶어 둔다.
        event.preventDefault();
        document.querySelector('.modal-close').focus();
      } else if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[role="button"]')) {
        event.preventDefault();
        event.target.click();
      }
    });

    // 4. 로또 로직
    function generateLotto() {
      var nums = [];
      while (nums.length < 6) {
        var n = Math.floor(Math.random() * 45) + 1;
        if (nums.indexOf(n) === -1) nums.push(n);
      }
      nums.sort(function (a, b) { return a - b; });
      var bonus;
      do { bonus = Math.floor(Math.random() * 45) + 1; } while (nums.indexOf(bonus) !== -1);

      function ballColor(n) {
        if (n <= 10) return 'ball-yellow';
        if (n <= 20) return 'ball-blue';
        if (n <= 30) return 'ball-red';
        if (n <= 40) return 'ball-gray';
        return 'ball-green';
      }

      document.getElementById('lottoNumbers').innerHTML = nums.map(function (n) {
        return '<span class="lotto-ball ' + ballColor(n) + '">' + n + '</span>';
      }).join('');
      document.getElementById('lottoBonus').className = 'lotto-bonus-ball ' + ballColor(bonus);
      document.getElementById('lottoBonus').textContent = bonus;
      document.getElementById('coffeeGame').style.display = 'none';
      document.getElementById('lottoResult').style.display = 'block';
      document.getElementById('lottoResult').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 5. 커피 내기: 인원수만큼 카드를 깔고 한 장에만 당첨을 숨긴다. 이름 입력 없이 한 명씩 고른다.
    var coffeeCount = 4;
    var coffeeLoser = -1;
    var coffeeDone = false;

    function startCoffee() {
      coffeeLoser = Math.floor(Math.random() * coffeeCount);
      coffeeDone = false;
      document.getElementById('coffeeCount').textContent = coffeeCount + '명';
      var cards = '';
      for (var i = 0; i < coffeeCount; i++) {
        cards += '<button type="button" class="coffee-card" aria-label="카드 ' + (i + 1) + '" onclick="flipCoffeeCard(' + i + ')">?</button>';
      }
      document.getElementById('coffeeCards').innerHTML = cards;
      document.getElementById('coffeeStatus').textContent = '한 명씩 카드를 고르세요';
      document.getElementById('lottoResult').style.display = 'none';
      document.getElementById('coffeeGame').style.display = 'block';
      document.getElementById('coffeeGame').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function changeCoffeeCount(delta) {
      coffeeCount = Math.min(8, Math.max(2, coffeeCount + delta));
      startCoffee();
    }

    function flipCoffeeCard(index) {
      if (coffeeDone) return;
      var cards = document.querySelectorAll('.coffee-card');
      if (index !== coffeeLoser) {
        cards[index].textContent = '통과';
        cards[index].classList.add('is-safe');
        cards[index].disabled = true;
        // 한 장만 남으면 그 카드가 당첨이므로 바로 공개한다.
        if (document.querySelectorAll('.coffee-card:not(:disabled)').length > 1) return;
      }
      coffeeDone = true;
      cards.forEach(function (card) { card.disabled = true; });
      cards[coffeeLoser].textContent = '☕';
      cards[coffeeLoser].classList.add('is-loser');
      document.getElementById('coffeeStatus').textContent = '당첨! 오늘 커피 삽니다 · 버튼을 누르면 다시 섞습니다';
    }

    // 6. 초기화
    loadLunchMenus();
  </script>
</body>
</html>
