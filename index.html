<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>점심 메뉴 & 로또</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0f1114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="오늘의 점심">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <h1>오늘의 점심</h1>
      <p class="today-date">
        <span class="date-main">
          <svg class="meta-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          <span id="todayDate"></span>
          <span class="weekday-chip" id="todayWeekday"></span>
        </span>
        <span class="visit-count" id="visitCount" hidden></span>
      </p>
    </header>
    <div class="weather-line" id="weatherLine" hidden></div>
    <p class="dayoff-notice" id="dayOffNotice" hidden>주말에는 이전 메뉴가 표시될 수 있습니다.</p>
    <p class="dayoff-notice" id="staleNotice" hidden></p>

    <div id="app">
      <div class="actions" id="lunchBoard"></div>

      <div class="quick-actions">
        <button class="btn" onclick="generateLotto()">로또<span class="btn-long"> 번호 뽑기</span></button>
        <button class="btn" onclick="startCoffee()">커피 내기</button>
      </div>
      <div class="side-panels">
        <div id="lottoResult" class="lotto-result" style="display:none">
          <div class="lotto-label">이번 주 행운의 번호</div>
          <div class="lotto-numbers" id="lottoNumbers"></div>
          <div class="lotto-bonus">
            <span class="lotto-plus">+</span>
            <span class="lotto-bonus-ball" id="lottoBonus"></span>
          </div>
        </div>
        <div id="coffeeGame" class="coffee-game" style="display:none">
          <div class="coffee-stepper">
            <button type="button" class="coffee-step" aria-label="인원 줄이기" onclick="changeCoffeeCount(-1)">−</button>
            <span class="coffee-count" id="coffeeCount"></span>
            <button type="button" class="coffee-step" aria-label="인원 늘리기" onclick="changeCoffeeCount(1)">+</button>
          </div>
          <div class="coffee-cards" id="coffeeCards"></div>
          <div class="coffee-status" id="coffeeStatus" aria-live="polite"></div>
        </div>
      </div>

      <div class="modal-overlay" id="lunchModal" role="dialog" aria-modal="true" aria-label="식단표 크게 보기" onclick="handleLunchModalClick(event)">
        <button type="button" class="modal-close" aria-label="닫기">✕</button>
        <div class="lunch-modal-content" id="lunchModalContent"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. 화면 갱신: 날짜가 바뀌면 전체 새로고침, 같은 날이면 메뉴·날씨·좋아요·방문자 수만 다시 받는다.
    var MENU_RECHECK_ON_RETURN_MS = 60000; // 화면 복귀·포커스 때의 최소 간격
    var MENU_RECHECK_WHILE_OPEN_MS = 15 * 60000; // 계속 켜 둔 화면의 주기 (서버 캐시와 같은 길이)

    function refreshOnReturn() {
      refreshScreen(MENU_RECHECK_ON_RETURN_MS);
    }

    document.addEventListener('visibilitychange', refreshOnReturn);
    window.addEventListener('focus', refreshOnReturn);
    window.addEventListener('pageshow', refreshOnReturn);
    // 연결이 돌아왔으면 최소 간격을 따지지 않고 바로 다시 받는다.
    window.addEventListener('online', function () { refreshScreen(0); });
    setInterval(function () { refreshScreen(MENU_RECHECK_WHILE_OPEN_MS); }, 60000);

    // 기기가 잠들었다 깨어날 때 복귀 신호 없이 타이머만 다시 도는 경우가 있다.
    // 짧은 타이머가 한참 밀렸으면 깨어난 것으로 보고 복귀와 똑같이 확인한다.
    var WAKE_CHECK_MS = 3000;
    var lastWakeCheckAt = Date.now();
    setInterval(function () {
      var now = Date.now();
      if (now - lastWakeCheckAt > WAKE_CHECK_MS * 5) refreshOnReturn();
      lastWakeCheckAt = now;
    }, WAKE_CHECK_MS);

    // 막 깨어난 기기에서는 요청이 실패하거나 한참 멈춰 있을 수 있다.
    // 오래 걸리면 끊고, 실패한 확인은 "확인했음"으로 남기지 않아 곧 다시 시도하게 한다.
    var FETCH_TIMEOUT_MS = 10000;
    var RETRY_DELAY_MS = 5000;
    var RETRY_DELAY_MAX_MS = 60000;
    var retryDelay = RETRY_DELAY_MS;
    var retryTimer = null;

    function fetchWithTimeout(url, options) {
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
      options = options || {};
      options.signal = controller.signal;
      return fetch(url, options).finally(function () { clearTimeout(timer); });
    }

    // 실패가 이어지면 간격을 두 배씩 늘려 서버에 몰리지 않게 한다.
    function retrySoon() {
      if (retryTimer) return;
      retryTimer = setTimeout(function () {
        retryTimer = null;
        refreshScreen(MENU_RECHECK_ON_RETURN_MS);
      }, retryDelay);
      retryDelay = Math.min(retryDelay * 2, RETRY_DELAY_MAX_MS);
    }

    // 2. 날짜 관련 유틸리티
    function getSeoulDateKey(date) {
      var offset = 9 * 60;
      var kstTime = new Date(date.getTime() + offset * 60000);
      return kstTime.toISOString().slice(0, 10);
    }

    // 탭끼리 공유되는 저장소가 아니라 이 페이지를 불러온 날짜와 비교해야
    // 다른 탭이 먼저 열려도 오래된 탭이 새로고침된다.
    var pageLoadDateKey = getSeoulDateKey(new Date());

    function refreshScreen(minInterval) {
      // 연결이 끊긴 채 새로고침하면 브라우저 오류 화면으로 바뀌므로 연결이 돌아올 때까지 미룬다.
      if (document.visibilityState !== 'visible' || !navigator.onLine) return;
      if (getSeoulDateKey(new Date()) !== pageLoadDateKey) {
        reloadForNewDay();
        return;
      }
      refreshLunchMenus(minInterval);
      retryBrokenLunchImages();
      loadWeather(minInterval);
      loadLikes(minInterval);
      loadVisits(minInterval);
    }

    // 연결이 안 되는 채로 새로 열면 오류 화면으로 바뀌거나 어제 화면이 그대로 남는다.
    // 작은 파일을 먼저 받아 보고, 받아질 때만 새로 연다.
    async function checkConnection() {
      var response = await fetchWithTimeout('/manifest.webmanifest?check=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
    }

    var reloadingForNewDay = false;

    async function reloadForNewDay() {
      if (reloadingForNewDay) return;
      reloadingForNewDay = true;
      try {
        await checkConnection();
        window.location.replace(window.location.pathname + '?refresh=' + Date.now());
      } catch (error) {
        reloadingForNewDay = false;
        noteRefreshFailure();
      }
    }

    // 갱신 실패를 알리는 단계
    // 0: 한 번의 실패는 곧 풀리는 경우가 많아 조용히 다시 시도한다.
    // 1: 연달아 실패하면 보이는 식단표가 최신이 아닐 수 있다고 알린다.
    // 2: 1분 넘게 이어지거나 사진을 끝내 못 받으면 인터넷 연결을 확인해 달라고 알린다.
    // 새로고침은 부탁하지 않는다. 자동 재시도가 같은 일을 계속하고 있어, 연결만 돌아오면 저절로 풀린다.
    var FAILS_BEFORE_NOTICE = 2;
    var FAILS_BEFORE_ASKING = 5; // 0·5·15·35·75초의 다섯 번째 실패
    var refreshFailCount = 0;
    var imageGaveUp = false;

    function updateStaleNotice() {
      var asking = refreshFailCount >= FAILS_BEFORE_ASKING || imageGaveUp;
      // 오류 카드가 보이는 중이면 카드가 이미 알려 주므로 첫 단계 안내는 겹쳐 띄우지 않는다.
      var noticing = refreshFailCount >= FAILS_BEFORE_NOTICE && !hasLunchError(lunchItems);
      var text = '최신 메뉴를 확인하지 못했습니다. 다시 시도하는 중입니다.';
      if (asking) text = '인터넷 연결을 확인해 주세요. 연결되면 자동으로 다시 불러옵니다.';
      var notice = document.getElementById('staleNotice');
      notice.textContent = text;
      notice.hidden = !asking && !noticing;
    }

    function noteRefreshFailure() {
      refreshFailCount++;
      updateStaleNotice();
      retrySoon();
    }

    function noteRefreshSuccess() {
      refreshFailCount = 0;
      retryDelay = RETRY_DELAY_MS;
      updateStaleNotice();
    }

    function formatSeoulDate(locale, options) {
      options.timeZone = 'Asia/Seoul';
      return new Intl.DateTimeFormat(locale, options).format(new Date());
    }

    // 요일은 달력처럼 토요일은 파랑, 일요일과 공휴일은 빨강으로 칠한 딱지로 보여 준다.
    var seoulWeekday = formatSeoulDate('en-US', { weekday: 'short' });
    var weekdayChip = document.getElementById('todayWeekday');
    document.getElementById('todayDate').textContent = formatSeoulDate('ko-KR', { month: 'long', day: 'numeric' });
    weekdayChip.textContent = formatSeoulDate('ko-KR', { weekday: 'long' });
    if (seoulWeekday === 'Sat') weekdayChip.classList.add('is-sat');
    if (seoulWeekday === 'Sun') weekdayChip.classList.add('is-red');
    document.getElementById('dayOffNotice').hidden = seoulWeekday !== 'Sat' && seoulWeekday !== 'Sun';

    // 공휴일에도 같은 안내를 띄운다. 날짜가 바뀌면 화면을 새로 열므로 한 번만 확인한다.
    async function loadHoliday() {
      try {
        var response = await fetch('/api/holiday');
        if (!response.ok) return;
        var payload = await response.json();
        if (!payload.ok || !payload.holiday || payload.date !== pageLoadDateKey) return;
        var notice = document.getElementById('dayOffNotice');
        notice.textContent = '오늘은 공휴일(' + payload.holiday + ')이라 이전 메뉴가 표시될 수 있습니다.';
        notice.hidden = false;
        weekdayChip.classList.add('is-red');
      } catch (error) {
        // 부가 안내라서 실패하면 띄우지 않는다.
      }
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    // 3. 점심 메뉴 로직
    var lunchItems = [];
    var lastLunchFetchAt = 0;
    var pendingLunchItems = null;

    function isLunchModalOpen() {
      return document.getElementById('lunchModal').classList.contains('active');
    }

    function hasLunchError(items) {
      return items.some(function (item) { return item.error; });
    }

    function getLunchSignature(items) {
      return items.map(function (item) {
        return item.id + '|' + (item.error ? 'error' : item.imageUrl);
      }).join(',');
    }

    function applyRefreshedLunchItems(items) {
      if (getLunchSignature(items) !== getLunchSignature(lunchItems)) renderLunchBoard(items);
    }

    // 열려 있는 화면의 메뉴만 조용히 다시 받는다. 바뀐 것이 없으면 화면을 건드리지 않는다.
    // 받지 못했거나 오류가 섞여 있으면 확인하지 못한 것으로 남겨, 될 때까지 간격을 늘려 가며 다시 시도한다.
    async function refreshLunchMenus(minInterval) {
      if (Date.now() - lastLunchFetchAt < minInterval) return;
      lastLunchFetchAt = Date.now();
      try {
        var response = await fetchWithTimeout('/api/lunch', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var items = (await response.json()).items || [];
        if (!items.length) throw new Error('empty menu');
        var failed = hasLunchError(items);
        // 잘 보이던 식단표는 일시적인 오류로 덮지 않는다. 이미 오류 카드가 보이는 중이면 받은 만큼은 반영한다.
        if (!failed || hasLunchError(lunchItems)) {
          // 크게 보는 중에는 바꾸지 않고, 닫을 때 반영한다.
          if (isLunchModalOpen()) pendingLunchItems = items;
          else applyRefreshedLunchItems(items);
        }
        if (failed) throw new Error('menu error');
        noteRefreshSuccess();
      } catch (error) {
        lastLunchFetchAt = 0;
        noteRefreshFailure();
      }
    }

    async function loadLunchMenus() {
      lastLunchFetchAt = Date.now();
      document.getElementById('lunchBoard').innerHTML =
        '<div class="loading"><div class="spinner"></div>메뉴를 불러오는 중</div>';
      try {
        var response = await fetchWithTimeout('/api/lunch', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var payload = await response.json();
        renderLunchBoard(payload.items || []);
      } catch (error) {
        renderLunchBoard([{
          name: '점심 메뉴',
          error: true,
          message: '메뉴를 불러오지 못했습니다.'
        }]);
        // 다시 시도 버튼을 누르지 않아도 될 때까지 알아서 다시 받는다.
        lastLunchFetchAt = 0;
        noteRefreshFailure();
      }
    }

    function renderLunchImage(item, extraAttrs) {
      return '<img class="lunch-modal-image" src="' + escapeHtml(item.imageUrl) + '" alt="' + escapeHtml(item.name) + ' 식단표"' + (extraAttrs || '') + '>';
    }

    function renderLunchError(item) {
      var channelLink = item.channelUrl
        ? '<a class="lunch-channel-link" href="' + escapeHtml(item.channelUrl) + '" target="_blank" rel="noopener">카카오 채널에서 보기</a>'
        : '';
      return '<div class="lunch-sub">' + escapeHtml(item.message) + '</div>' + channelLink +
             '<button type="button" class="btn btn-retry" onclick="loadLunchMenus()">다시 시도</button>';
    }

    function renderLunchBoard(items) {
      lunchItems = items;
      var lunchBoard = document.getElementById('lunchBoard');
      if (!lunchItems.length) {
        lunchBoard.innerHTML = '<div class="lunch-modal-item" style="text-align:center;padding:20px;"><div class="lunch-sub">표시할 메뉴가 없습니다.</div></div>';
        return;
      }
      var viewableIndex = 0;
      lunchBoard.innerHTML = lunchItems.map(function (item) {
        // 좋아요 버튼이 카드 안에 있으므로 크게 보기는 카드 전체가 아니라 이미지에만 건다.
        var content = item.error
          ? renderLunchError(item)
          : renderLunchImage(item, ' role="button" tabindex="0" onclick="showLunchModal(' + (viewableIndex++) + ')"');
        var likeSlot = item.error ? '' : '<span class="like-slot" data-like-id="' + escapeHtml(item.id) + '"></span>';

        return '<div class="lunch-modal-item' + (item.error ? ' is-error' : '') + '">' +
               '<div class="lunch-head"><div class="lunch-name">' + escapeHtml(item.name) + '</div>' + likeSlot + '</div>' +
               content + '</div>';
      }).join('');
      renderLikes();
    }

    // 3-0. 사진 내려받기 실패: 주소는 받았는데 사진 파일을 못 받으면 같은 주소로 다시 받는다.
    var IMAGE_RETRY_MAX = 5;
    var IMAGE_RETRY_DELAY_MS = 3000;

    function reloadLunchImage(img) {
      // 같은 주소라도 다시 넣으면 브라우저가 새로 내려받는다.
      img.src = img.getAttribute('src');
    }

    // error는 위로 전달되지 않는 이벤트라 캡처 단계에서 한 번에 받는다. 3초부터 두 배씩 늘려 다섯 번까지 시도한다.
    document.addEventListener('error', function (event) {
      var img = event.target;
      if (!img.matches || !img.matches('.lunch-modal-image')) return;
      var tries = Number(img.getAttribute('data-retry') || 0);
      if (tries >= IMAGE_RETRY_MAX) {
        imageGaveUp = true;
        updateStaleNotice();
        return;
      }
      img.setAttribute('data-retry', tries + 1);
      setTimeout(function () {
        if (img.isConnected) reloadLunchImage(img);
      }, IMAGE_RETRY_DELAY_MS * Math.pow(2, tries));
    }, true);

    document.addEventListener('load', function (event) {
      if (!imageGaveUp || !event.target.matches || !event.target.matches('.lunch-modal-image')) return;
      imageGaveUp = false;
      updateStaleNotice();
    }, true);

    // 다섯 번을 다 쓰고도 깨진 채 남은 사진은 화면에 돌아오거나 주기적으로 확인할 때 처음부터 다시 시도한다.
    function retryBrokenLunchImages() {
      document.querySelectorAll('.lunch-modal-image').forEach(function (img) {
        if (!img.complete || img.naturalWidth > 0 || Number(img.getAttribute('data-retry') || 0) < IMAGE_RETRY_MAX) return;
        img.removeAttribute('data-retry');
        reloadLunchImage(img);
      });
    }

    // 3-1. 좋아요: 하루에 한 식당만, 한 번 누를 수 있다. 저장소가 숫자를 내릴 수 없어 취소는 없다.
    var LIKE_STORAGE_KEY = 'lunch-like';
    var HEART_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>';
    var likeCounts = null; // 한 번도 받지 못했으면 좋아요 영역을 그리지 않는다.
    var likeDate = '';
    var likeSending = false;
    var lastLikesFetchAt = 0;
    var myLikeFallback = null; // 저장소를 못 쓰는 브라우저에서도 화면을 연 동안은 한 번으로 막는다.

    function getMyLike() {
      var saved = myLikeFallback;
      try {
        saved = JSON.parse(localStorage.getItem(LIKE_STORAGE_KEY)) || saved;
      } catch (error) {
        // 저장소를 못 쓰면 이번 화면의 기록만 본다.
      }
      return saved && saved.date === likeDate ? saved.id : null;
    }

    function saveMyLike(id) {
      myLikeFallback = { date: likeDate, id: id };
      try {
        localStorage.setItem(LIKE_STORAGE_KEY, JSON.stringify(myLikeFallback));
      } catch (error) {
        // 저장하지 못해도 이번 화면에서는 myLikeFallback으로 막힌다.
      }
    }

    function applyLikes(payload) {
      // 같은 날에는 숫자가 줄지 않으므로, 늦게 도착한 예전 응답이 방금 누른 좋아요를 지우지 않게 큰 값을 남긴다.
      var sameDay = likeCounts && payload.date === likeDate;
      // 응답에 빠진 식당(서버가 못 읽은 숫자)은 보이던 값을 그대로 둔다.
      var counts = sameDay ? Object.assign({}, likeCounts) : {};
      Object.keys(payload.counts).forEach(function (id) {
        counts[id] = sameDay ? Math.max(payload.counts[id], likeCounts[id] || 0) : payload.counts[id];
      });
      likeCounts = counts;
      likeDate = payload.date;
      renderLikes();
    }

    function renderLikes() {
      var myLike = getMyLike();
      var best = 0;
      var leaders = [];
      Object.keys(likeCounts || {}).forEach(function (id) {
        if (likeCounts[id] > best) {
          best = likeCounts[id];
          leaders = [id];
        } else if (likeCounts[id] === best) {
          leaders.push(id);
        }
      });

      document.querySelectorAll('.like-slot').forEach(function (slot) {
        var id = slot.getAttribute('data-like-id');
        if (!likeCounts || likeCounts[id] == null) {
          slot.innerHTML = '';
          return;
        }
        var liked = myLike === id;
        var badge = best > 0 && leaders.length === 1 && leaders[0] === id ? '<span class="like-badge">인기</span>' : '';
        slot.innerHTML = badge +
          '<button type="button" class="like-btn' + (liked ? ' is-liked' : '') + '"' +
          ' aria-pressed="' + liked + '" aria-label="좋아요 ' + likeCounts[id] + '개"' +
          (myLike || likeSending ? ' disabled' : '') +
          ' onclick="sendLike(\'' + escapeHtml(id) + '\')">' + HEART_ICON + '<span>' + likeCounts[id] + '</span></button>';
      });
    }

    async function loadLikes(minInterval) {
      if (Date.now() - lastLikesFetchAt < (minInterval || 0)) return;
      lastLikesFetchAt = Date.now();
      try {
        var response = await fetchWithTimeout('/api/likes');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var payload = await response.json();
        if (payload.ok) applyLikes(payload);
      } catch (error) {
        // 보이던 숫자 유지, 처음부터 실패했으면 숨긴 채 둔다. 다음 확인 때 다시 받는다.
        lastLikesFetchAt = 0;
      }
    }

    async function sendLike(id) {
      if (likeSending || getMyLike()) return;
      likeSending = true;
      renderLikes();
      try {
        var response = await fetch('/api/likes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        });
        var payload = response.ok ? await response.json() : null;
        if (payload && payload.ok) {
          likeDate = payload.date;
          saveMyLike(id);
          applyLikes(payload);
        }
      } catch (error) {
        // 실패하면 다시 누를 수 있게 버튼만 되돌린다.
      }
      likeSending = false;
      renderLikes();
    }

    var lunchModalHistoryPushed = false;

    var lunchModalOpener = null;

    function showLunchModal(index) {
      lunchModalOpener = document.activeElement;
      var content = document.getElementById('lunchModalContent');
      var modal = document.getElementById('lunchModal');
      content.innerHTML = lunchItems.filter(function (item) {
        return !item.error;
      }).map(function (item, itemIndex) {
        return '<div class="lunch-modal-item' + (itemIndex === index ? ' is-selected' : '') + '">' +
               '<div class="lunch-name">' + escapeHtml(item.name) + '</div>' +
               renderLunchImage(item) +
               '</div>';
      }).join('');
      modal.classList.add('active');
      document.body.classList.add('modal-open');
      modal.scrollTop = 0;

      // 뒤로가기가 페이지 이탈 대신 모달 닫기로 동작하도록 기록을 하나 쌓는다.
      history.pushState({ lunchModal: true }, '');
      lunchModalHistoryPushed = true;
      modal.querySelector('.modal-close').focus();
    }

    function hideLunchModal() {
      var modal = document.getElementById('lunchModal');
      var wasOpen = modal.classList.contains('active');
      lunchModalHistoryPushed = false;
      modal.classList.remove('active');
      document.body.classList.remove('modal-open');
      // 키보드 사용자가 모달을 연 카드로 돌아오게 한다.
      if (wasOpen && lunchModalOpener && lunchModalOpener.focus) lunchModalOpener.focus();
      if (pendingLunchItems) {
        var refreshedItems = pendingLunchItems;
        pendingLunchItems = null;
        applyRefreshedLunchItems(refreshedItems);
      }
    }

    function closeLunchModal() {
      if (lunchModalHistoryPushed) {
        // popstate에서 실제로 닫는다. 연속 탭으로 페이지를 벗어나지 않도록 먼저 해제한다.
        lunchModalHistoryPushed = false;
        history.back();
        return;
      }
      hideLunchModal();
    }

    // 이미지와 식당 이름을 제외한 영역(닫기 버튼 포함)을 누르면 닫는다.
    function handleLunchModalClick(event) {
      if (!event.target.closest('img, .lunch-name')) closeLunchModal();
    }

    window.addEventListener('popstate', hideLunchModal);

    document.addEventListener('keydown', function (event) {
      var modalOpen = document.getElementById('lunchModal').classList.contains('active');
      if (event.key === 'Escape' && modalOpen) {
        closeLunchModal();
      } else if (event.key === 'Tab' && modalOpen) {
        // 모달 안에서 이동할 수 있는 요소는 닫기 버튼뿐이므로 포커스를 그 안에 묶어 둔다.
        event.preventDefault();
        document.querySelector('.modal-close').focus();
      } else if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[role="button"]')) {
        event.preventDefault();
        event.target.click();
      }
    });

    // 4. 로또 로직
    function generateLotto() {
      var nums = [];
      while (nums.length < 6) {
        var n = Math.floor(Math.random() * 45) + 1;
        if (nums.indexOf(n) === -1) nums.push(n);
      }
      nums.sort(function (a, b) { return a - b; });
      var bonus;
      do { bonus = Math.floor(Math.random() * 45) + 1; } while (nums.indexOf(bonus) !== -1);

      function ballColor(n) {
        if (n <= 10) return 'ball-yellow';
        if (n <= 20) return 'ball-blue';
        if (n <= 30) return 'ball-red';
        if (n <= 40) return 'ball-gray';
        return 'ball-green';
      }

      document.getElementById('lottoNumbers').innerHTML = nums.map(function (n) {
        return '<span class="lotto-ball ' + ballColor(n) + '">' + n + '</span>';
      }).join('');
      document.getElementById('lottoBonus').className = 'lotto-bonus-ball ' + ballColor(bonus);
      document.getElementById('lottoBonus').textContent = bonus;
      document.getElementById('coffeeGame').style.display = 'none';
      document.getElementById('lottoResult').style.display = 'block';
      document.getElementById('lottoResult').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // 5. 커피 내기: 인원수만큼 카드를 깔고 한 장에만 당첨을 숨긴다. 이름 입력 없이 한 명씩 고른다.
    var coffeeCount = 4;
    var coffeeLoser = -1;
    var coffeeDone = false;

    function startCoffee() {
      coffeeLoser = Math.floor(Math.random() * coffeeCount);
      coffeeDone = false;
      document.getElementById('coffeeCount').textContent = coffeeCount + '명';
      var cards = '';
      for (var i = 0; i < coffeeCount; i++) {
        cards += '<button type="button" class="coffee-card" aria-label="카드 ' + (i + 1) + '" onclick="flipCoffeeCard(' + i + ')">?</button>';
      }
      document.getElementById('coffeeCards').innerHTML = cards;
      document.getElementById('coffeeStatus').textContent = '한 명씩 카드를 고르세요';
      document.getElementById('lottoResult').style.display = 'none';
      document.getElementById('coffeeGame').style.display = 'block';
      document.getElementById('coffeeGame').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function changeCoffeeCount(delta) {
      coffeeCount = Math.min(8, Math.max(2, coffeeCount + delta));
      startCoffee();
    }

    function flipCoffeeCard(index) {
      if (coffeeDone) return;
      var cards = document.querySelectorAll('.coffee-card');
      if (index !== coffeeLoser) {
        cards[index].textContent = '통과';
        cards[index].classList.add('is-safe');
        cards[index].disabled = true;
        // 한 장만 남으면 그 카드가 당첨이므로 바로 공개한다.
        if (document.querySelectorAll('.coffee-card:not(:disabled)').length > 1) return;
      }
      coffeeDone = true;
      cards.forEach(function (card) { card.disabled = true; });
      cards[coffeeLoser].textContent = '☕';
      cards[coffeeLoser].classList.add('is-loser');
      document.getElementById('coffeeStatus').textContent = '당첨! 오늘 커피 삽니다 · 버튼을 누르면 다시 섞습니다';
    }

    // 6. 날씨: 부가 정보라서 실패하면 줄을 숨긴 채 둔다.
    // 비·눈 표시가 아래에 붙는 아이콘은 구름을 위로 올려 그린다.
    var CLOUD_HIGH = '<path d="M7 15a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 8a3.5 3.5 0 0 1-.5 7H7z"/>';
    var WEATHER_ICONS = {
      sun: '<g class="wx-sun"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></g>',
      'cloud-sun': '<g class="wx-sun"><circle cx="16.5" cy="7.5" r="3.2"/><path d="M16.5 1.8v1.4M22.2 7.5h-1.4M20.5 3.5l-1 1"/></g>' +
        '<path class="wx-cover" d="M6.5 19a3.5 3.5 0 0 1-.4-6.98A5.2 5.2 0 0 1 16 12.8a3 3 0 0 1-.4 6.2H6.5z"/>',
      cloud: '<path d="M7 18a4 4 0 0 1-.5-7.97A6 6 0 0 1 18 11a3.5 3.5 0 0 1-.5 7H7z"/>',
      fog: CLOUD_HIGH + '<path d="M5 18.5h14M8 21.5h8"/>',
      rain: CLOUD_HIGH + '<path class="wx-rain" d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
      snow: CLOUD_HIGH + '<g class="wx-snow"><circle cx="8" cy="19.5" r="1"/><circle cx="12" cy="19.5" r="1"/><circle cx="16" cy="19.5" r="1"/></g>',
      storm: CLOUD_HIGH + '<path class="wx-sun" d="M13 16.5l-2.5 3.5h3L12 23"/>',
      drop: '<path class="wx-rain" d="M12 4c3 3.6 5 6.3 5 9a5 5 0 0 1-10 0c0-2.7 2-5.4 5-9z"/>'
    };
    var DUST_TONES = { '좋음': 'is-good', '보통': 'is-fair', '나쁨': 'is-bad', '매우 나쁨': 'is-worst' };

    function weatherIcon(name) {
      if (!WEATHER_ICONS[name]) return '';
      return '<svg class="weather-icon" viewBox="0 0 24 24" aria-hidden="true">' + WEATHER_ICONS[name] + '</svg>';
    }

    // extra: 넓은 화면에서만 보여 주는 칸
    function weatherCell(label, iconHtml, value, text, extra) {
      return '<div class="weather-cell' + (extra ? ' is-extra' : '') + '">' +
        '<span class="weather-label">' + escapeHtml(label) + '</span>' +
        '<span class="weather-value">' + iconHtml + '<b>' + escapeHtml(value) + '</b>' +
        (text ? '<span class="weather-text">' + escapeHtml(text) + '</span>' : '') +
        '</span></div>';
    }

    var lastWeatherFetchAt = 0;
    var lastWeatherHtml = '';

    // 처음에는 간격 없이, 그 뒤로는 메뉴와 같은 간격으로 다시 받는다. 실패하면 보이던 값을 그대로 둔다.
    async function loadWeather(minInterval) {
      if (Date.now() - lastWeatherFetchAt < (minInterval || 0)) return;
      lastWeatherFetchAt = Date.now();
      try {
        var response = await fetchWithTimeout('/api/weather');
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var weather = await response.json();
        if (!weather.ok) return;

        var cells = [weatherCell(weather.location + ' 지금', weatherIcon(weather.now.icon), weather.now.temperature + '°', weather.now.text)];
        if (weather.lunch) {
          cells.push(weatherCell('12시', weatherIcon(weather.lunch.icon), weather.lunch.temperature + '°', weather.lunch.text));
        }
        if (weather.evening) {
          cells.push(weatherCell('18시', weatherIcon(weather.evening.icon), weather.evening.temperature + '°', weather.evening.text, true));
        }
        if (weather.range) {
          cells.push(weatherCell('최고 / 최저', '', weather.range.high + '° / ' + weather.range.low + '°', '', true));
        }
        if (weather.rain.chance != null) {
          cells.push(weatherCell(weather.rain.label + ' 강수', weatherIcon('drop'), weather.rain.chance + '%', ''));
        }
        if (weather.dust) {
          cells.push(weatherCell('미세먼지', '<span class="weather-dot ' + (DUST_TONES[weather.dust] || '') + '"></span>', weather.dust, ''));
        }

        var html = cells.join('');
        if (html === lastWeatherHtml) return;
        lastWeatherHtml = html;
        var line = document.getElementById('weatherLine');
        line.innerHTML = html;
        line.hidden = false;
      } catch (error) {
        // 보이던 값(없었으면 숨긴 상태)을 유지하고, 다음 확인 때 다시 받는다.
        lastWeatherFetchAt = 0;
      }
    }

    // 7. 오늘 방문자 수: 브라우저마다 하루 한 번만 세고, 그 뒤로는 읽기만 한다.
    var VISIT_STORAGE_KEY = 'lunch-visit';
    var VISIT_ICON = '<svg class="meta-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3-5.8 7-5.8s7 2.2 7 5.8"/></svg>';
    var visitCount = 0;
    var lastVisitsFetchAt = 0;

    // 기록을 남길 수 없는 브라우저는 열 때마다 세어져 숫자가 부풀므로 세지 않는다.
    function shouldCountVisit() {
      try {
        if (localStorage.getItem(VISIT_STORAGE_KEY) === pageLoadDateKey) return false;
        localStorage.setItem(VISIT_STORAGE_KEY, localStorage.getItem(VISIT_STORAGE_KEY) || '');
        return true;
      } catch (error) {
        return false;
      }
    }

    async function loadVisits(minInterval) {
      if (Date.now() - lastVisitsFetchAt < (minInterval || 0)) return;
      lastVisitsFetchAt = Date.now();
      try {
        var counting = shouldCountVisit();
        var response = await fetchWithTimeout('/api/visits', counting ? { method: 'POST' } : undefined);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var payload = await response.json();
        if (!payload.ok) return;
        // 비교할 때와 같은 기기 날짜로 남겨야 기기 시계가 틀려도 다시 세지 않는다.
        if (counting) localStorage.setItem(VISIT_STORAGE_KEY, pageLoadDateKey);

        // 같은 날에는 줄지 않으므로 잠깐 저장된 예전 응답이 와도 큰 값을 남긴다.
        visitCount = Math.max(visitCount, payload.count);
        if (!visitCount) return;
        var label = document.getElementById('visitCount');
        label.innerHTML = VISIT_ICON + '<span>오늘 <b>' + visitCount + '</b>명 방문</span>';
        label.hidden = false;
      } catch (error) {
        // 보이던 숫자 유지, 처음부터 실패했으면 숨긴 채 둔다. 다음 확인 때 다시 받는다.
        lastVisitsFetchAt = 0;
      }
    }

    // 8. 초기화
    loadVisits();
    loadHoliday();
    loadWeather();
    loadLikes();
    loadLunchMenus();
  </script>
</body>
</html>
